# =====================================================================
# Actividad 6 - Control de acceso según el rol
#
# Flujo de 2 pasos en GraphiQL (http://127.0.0.1:8000/graphql):
#   1) Ejecuta `Login` y copia el valor de `token`.
#   2) En la pestaña "Headers" pega:
#        { "Authorization": "Bearer TOKEN" }
#      y ejecuta cualquier otra operación. Ya NO se envía actorCompanyUserId:
#      la identidad sale del token.
#
# Las variables de cada operación están en variables/a6_*.json
# (se generan con: python scripts/generar_variables_actividad6.py).
# =====================================================================

# Variables: variables/a6_login_<persona>.json
#   { "input": { "email": "ana@actividad6.com", "password": "Secreto123!" } }
# companyId es OPCIONAL: solo hace falta si el usuario tiene membresías
# activas en varias empresas:
#   { "input": { "email": "...", "password": "...", "companyId": "1" } }
mutation Login($input: LoginInput!) {
  login(input: $input) {
    token
    tokenType
    user { id name email }
  }
}

# Variables: variables/a6_create_account.json
mutation CrearCuenta($input: CreateAccountInput!) {
  createAccount(input: $input) { id name companyId }
}

# Variables: variables/a6_create_transaction.json
mutation CrearMovimiento($input: CreateTransactionInput!) {
  createTransaction(input: $input) { id amount transactionType capturedBy }
}

# Variables: variables/a6_assign_role_pedro_capturista.json
mutation AsignarRol($input: AssignRoleInput!) {
  assignRole(input: $input) { id role { code } isActive }
}

# Variables: variables/a6_accounts_empresa1.json
query CuentasDeEmpresa($companyId: ID!) {
  accounts(companyId: $companyId) { id name }
}

# =====================================================================
# Operaciones de la actividad 5 (ahora también con token en el header)
# =====================================================================

fragment DatosPermiso on Permission {
  id
  code
  name
}

# Variables: variables/e02_catalogo.json  ({})
query ExplorarCatalogo {
  cuentas: permissionCatalog(resource: ACCOUNTS) {
    ...DatosPermiso
  }
  movimientos: permissionCatalog(resource: TRANSACTIONS) {
    ...DatosPermiso
  }
}

# Variables: variables/e02_catalogo.json  ({})
query CatalogoCompleto {
  permissionCatalog {
    ...DatosPermiso
  }
}

# Variables: variables/e02_enum_invalido.json  ({ "recurso": "PAYMENTS" })
query CatalogoPorRecurso($recurso: PermissionResource) {
  permissionCatalog(resource: $recurso) {
    ...DatosPermiso
  }
}

# Variables: variables/e03_e04_e05_s1.json  (roleId + permissionIds)
query RevisarConfiguracion($input: SetRolePermissionsInput!) {
  previewRolePermissions(input: $input) {
    role { code }
    current { code }
    toActivate { code }
    toDeactivate { code }
    unchanged { code }
    finalCount
  }
}

# Variables: variables/e03_e04_e05_s1.json / e05_e09_s0.json / e08_vacia.json
mutation AplicarConfiguracion($input: SetRolePermissionsInput!) {
  setRolePermissions(input: $input) {
    role { code }
    activated { code }
    deactivated { code }
    unchanged { code }
    finalCount
    changed
  }
}

# Variables: variables/e01_listar.json  ({})
query ListarRoles {
  roles {
    id
    code
    name
    description
    isActive
  }
}

# Variables: variables/e01_listar.json  ({})
query ListarPermisos {
  permissions {
    id
    code
    name
    description
    isActive
  }
}

# Variables: variables/e01_lista_capturista.json  ({ "roleId": "3" })
query ListaDeUnRol($roleId: ID!) {
  rolePermissions(roleId: $roleId) {
    id
    isActive
    role { code }
    permission {
      id
      code
      name
    }
  }
}


# =====================================================================
# Actividad 7 - Balances por cuenta y general
#
# Datos:      python scripts/preparar_demo_actividad7.py
# Variables:  python scripts/generar_variables_actividad7.py  (variables/a7_*.json)
# Entra con `Login` (variables/a7_login_<persona>.json) y pega el token en
# Headers: { "Authorization": "Bearer TOKEN" }.  Personas: ana (ADMINISTRADOR),
# luis (CONTADOR), maria (CAPTURISTA), pedro (CONSULTA) de la empresa A;
# adminb (empresa B, laboratorio) y adminc (empresa C, sin cuentas).
# Todos los importes están en MXN y se devuelven como cadenas con 2 decimales.
# =====================================================================

# Variables: variables/a7_balance_banco.json | a7_balance_caja.json | a7_balance_ahorro.json
#            variables/a7_balance_banco_dia28.json (B02) | a7_balance_cuenta_b.json (empresa B)
#   { "accountId": "ID_REAL", "from": "2026-10-26", "to": "2026-10-30" }
query BalanceDeUnaCuenta($accountId: ID!, $from: Date!, $to: Date!) {
  accountBalance(accountId: $accountId, fromDate: $from, toDate: $to) {
    accountId
    accountName
    isActive
    openingBalance
    totalIncome
    totalExpense
    profit
    closingBalance
    isInRed
  }
}

# Variables: variables/a7_balance_general.json  ({ "from": "2026-10-26", "to": "2026-10-30" })
query BalanceDeLaEmpresa($from: Date!, $to: Date!) {
  generalBalance(fromDate: $from, toDate: $to) {
    companyId
    currency
    fromDate
    toDate
    openingBalance
    totalIncome
    totalExpense
    profit
    closingBalance
    isInRed
    accountsInRed
    accounts {
      accountId
      accountName
      isActive
      closingBalance
      isInRed
    }
  }
}

# B04, B05, B06 y B15 capturan movimientos con fecha de operación (transactionDate,
# UTC).  Si se omite, se usa el instante actual del servidor; capturedAt siempre lo
# pone el servidor.  Usa a Admin B (variables/a7_login_adminb.json) y la cuenta de
# la empresa B.  Variables: variables/a7_b04_*.json, a7_b05_*.json, a7_b06_*.json,
# a7_b15_egreso_50.json, a7_b13_captura_consulta.json (Pedro, debe rechazarse).
mutation CapturarMovimiento($input: CreateTransactionInput!) {
  createTransaction(input: $input) {
    id
    amount
    transactionType
    transactionDate
    capturedAt
  }
}

# B09: otro concepto permitido para Banco.  Variables: variables/a7_b09_asignar_concepto.json
# (entra con Ana).  No agrega movimientos: los balances no cambian.
mutation AsignarConcepto($input: AssignConceptToAccountInput!) {
  assignConceptToAccount(input: $input) {
    id
    accountId
    conceptId
    isActive
  }
}

# B07: desactivar un movimiento.  Se prepara con `python scripts/casos_b07_b08.py b07`
# o con esta mutación (id del movimiento en { "id": "..." }).
mutation DesactivarMovimiento($id: ID!) {
  deleteTransaction(id: $id) {
    id
    isActive
  }
}

# B14: quitar y devolver transactions.read al rol CONSULTA (entra con Ana).
# Variables: variables/a7_b14_quitar_transactions_read.json y
#            variables/a7_b14_restaurar_permisos.json
# La mutación AplicarConfiguracion (más arriba) recibe estas variables.

# =========================================================
# UNIDAD III, ACTIVIDAD 2 - Idempotencia en createTransaction
# =========================================================
# Datos: python scripts/preparar_demo_u3a2.py   (entra con Ana: variables/u3a2_login_ana.json)
#
# 1) Variables variables/u3a2_tx_llave1.json, ejecutar DOS veces: mismo id.
# 2) Variables variables/u3a2_tx_llave2.json: otro id, aunque el monto sea igual.
# 3) Variables variables/u3a2_tx_llave1_otro_monto.json: error, la llave ya se usó con otros datos.
mutation CrearMovimiento($input: CreateTransactionInput!) {
  createTransaction(input: $input) {
    id
    amount
    transactionType
    transactionDate
    capturedAt
  }
}

# =========================================================
# UNIDAD III, ACTIVIDAD 2 - Lecturas del dashboard administrativo
# =========================================================
# Lo que el token permite (sin variables).
query MiAcceso {
  myAccess { companyUserId companyId companyName userName isAdmin role { code name } permissions }
}

# La tabla Usuarios del dashboard.  Variables: variables/u3a2_company_users.json
query UsuariosEmpresa($companyId: ID!) {
  companyUsers(companyId: $companyId) {
    id
    isAdmin
    isActive
    role { code name }
    user { name email }
  }
}
